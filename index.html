<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration form</h1>
    <form action="mailto:pulagurlasairam@karunya.edu.in" method="post" enctype="text/plain" >
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name: </label>
            <input type="text" name="name" id="name" placeholder="enter the name" required><br><br>

            <label for="regno">reg no:</label>
            <input type="text" name="regno" id="regno" placeholder="URK24CS...."><br><br>

            <label for="mail">Email: </label>
            <input type="=email" name="email" id="mail" placeholder="example@gmail.com"><br><br>

            <label for="password">Password: </label>
            <input type="=password" name="password" id="password" placeholder="......"><br><br>

            <label for="date">Date of Birth:</label>
            <input type="date" id="date"  name="birthdate" ><br><br>
            
            <label for="age">Age:</label>
            <input type="age" id="age"  name="age" ><br><br>

            <label for="time">Perferred time:</label>
            <input type="time" id="time"  name="time" ><br><br>

            
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Academic Information</legend>
            <label for="drop">Department: </label>
            <select name="drop" id="drop">
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="MECHANICAL">MECHANICAL</option>
            </select>
            <br><br>
            <label for="gender">Gender: </label>
            <input type="radio" name="gender" id="male">male
            <input type="radio" name="gender" id="female">female 
            <input type="radio" name="gender" id="other">other <br><br>

            <label for="check">Skills: </label>
            <input type="checkbox" name="check" id="check">HTML
            <input type="checkbox" name="check" id="check">CSS
            <input type="checkbox" name="check" id="check">PYTHON
            <input type="checkbox" name="check" id="check">JAVA
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Additional Information</legend>
            <label for="file">Upload Resume: </label>
            <input type="file" name="file" id="file"> <br><br>

             <label for="link">Portfolio website: </label>
            <input type="link" name="link" id="link" placeholder="https://example.com"><br><br>

             <label for="color">Favorite color: </label>
            <input type="color" name="color" id="color"><br><br>

        </fieldset>
        <br>
        <input type="submit" value="submit">
        <input type="reset" value="reset">
    </form>
</body>
</html>
